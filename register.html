<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | CrowdMeter NJIT</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>CrowdMeter NJIT</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main class="account">
    <h2>Create an account</h2>

    <!-- The server checks these values again before saving. -->
    <form id="registerForm">
      <label>
        Username
        <input name="username" type="text"
               pattern="[A-Za-z0-9_]{3,24}"
               autocomplete="username" required>
      </label>

      <label>
        NJIT email
        <input name="email" type="email"
               pattern=".+@njit\.edu"
               maxlength="254"
               placeholder="you@njit.edu"
               autocomplete="email" required>
      </label>

      <label>
        Password
        <input name="password" type="password"
               minlength="12" maxlength="128"
               autocomplete="new-password" required>
      </label>

      <small>
        Use 12–128 characters with a letter and a number.
      </small>

      <label>
        Confirm password
        <input name="confirm" type="password"
               minlength="12" maxlength="128"
               autocomplete="new-password" required>
      </label>

      <button type="submit">Register</button>
    </form>

    <p id="message" role="status"></p>

    <p>Already registered? <a href="/login.html">Login</a></p>
  </main>

  <footer>IT 340 · CrowdMeter NJIT</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | CrowdMeter NJIT</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>CrowdMeter NJIT</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main class="account">
    <h2>Login</h2>

    <!-- JavaScript sends this form to the back end. -->
    <form id="loginForm">
      <label>
        Username
        <input name="username" type="text"
               minlength="3" maxlength="24"
               autocomplete="username" required>
      </label>

      <label>
        Password
        <input name="password" type="password"
               maxlength="128"
               autocomplete="current-password" required>
      </label>

      <button type="submit">Login</button>
    </form>

    <!-- Show success or error messages here. -->
    <p id="message" role="status"></p>

    <p>New here? <a href="/register.html">Register</a></p>
  </main>

  <footer>IT 340 · CrowdMeter NJIT</footer>
</body>
</html>

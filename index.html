<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Load the account buttons and login checks. -->
<script src="app.js" defer></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CrowdMeter NJIT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CrowdMeter NJIT</h1>
    <nav>
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/register.html">Register</a>
    </nav>
  </header>

  <main>
    <!-- Display the account returned by the back end. -->
<p id="accountStatus" role="status">Checking login...</p>
<button id="logoutButton" type="button" hidden>Log out</button>
    <h2>Find your space. Skip the crowd.</h2>
    <p>Check campus crowd levels before heading out.</p>
    <p>Sample data for Milestone 1.</p>

    <section class="spaces" aria-label="Campus facilities">
      <article>
        <h3>Van Houten Library</h3>
        <p class="moderate">Moderate</p>
      </article>

      <article>
        <h3>Campus Center Dining</h3>
        <p class="busy">Busy</p>
      </article>

      <article>
        <h3>Wellness and Events Center</h3>
        <p class="quiet">Quiet</p>
      </article>
    </section>
  </main>

  <footer>IT 340 · CrowdMeter NJIT</footer>
</body>
</html>
